[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-factor"
version = "1.0.0"
description = "GARCH simulation and non-parametric VaR models with backtesting and monitoring for volatility factors."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matt Arbaiza" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
# Numerical results are regression-tested against the reference environment
# (numpy 2.2, pandas 2.2, scipy 1.15, arch 8.0, numba 0.61). pandas 3 is excluded
# until it has been checked against the golden outputs.
dependencies = [
    "arch>=7.0",
    "numba>=0.59",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1,<3",
    "plotly>=5.18",
    "pyarrow>=14",
    "pyyaml>=6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_factor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: compares against outputs captured from the pre-refactor code (slower)",
]
filterwarnings = [
    "error::FutureWarning:volatility_factor.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/regression/capture_legacy_goldens.py", "lending_value"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
