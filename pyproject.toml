[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-factor"
version = "1.0.0"
description = "GARCH simulation and non-parametric VaR models with backtesting and monitoring for volatility factors."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Matt Arbaiza" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
# Use the tested numerical stack for reproducible VaR outputs.
dependencies = [
    "arch==8.0.0",
    "llvmlite==0.44.0",
    "numba==0.61.2",
    "numpy==2.2.2",
    "openpyxl>=3.1",
    "pandas==2.2.3",
    "plotly>=5.18",
    "pyarrow>=14",
    "pyyaml>=6",
    "scipy==1.15.1",
    "statsmodels==0.14.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volatility_factor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: checks numerical results against reference fixtures",
]
filterwarnings = [
    "error::FutureWarning:volatility_factor.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["lending_value"]

[tool.ruff.lint]
# D1xx: every module, class, function and method needs a docstring.
select = ["E", "F", "I", "UP", "B", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"
