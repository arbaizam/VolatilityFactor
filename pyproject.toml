[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-factor"
version = "0.1.0"
description = "Volatility factor VaR models and Databricks migration utilities"
requires-python = ">=3.10"
dependencies = [
    "arch>=7.2,<8",
    "numba>=0.58,<0.66",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.33",
    "databricks-sql-connector>=3.0",
]
dash = [
    "dash>=2.18",
    "dash-ag-grid>=31.0",
    "plotly>=5.24",
]
dev = [
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
volatility-factor-run = "volatility_factor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
